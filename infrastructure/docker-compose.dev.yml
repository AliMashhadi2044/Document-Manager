name: document-manager-dev

# سرویس پایه (postgres) با `docker compose up -d` بالا می‌آید.
#
# توجه: پورت میزبان عمداً 5433 است، نه 5432. روی این ماشین یک PostgreSQL محلی از قبل
# روی 5432 در حال اجراست و اگر از همان پورت استفاده کنیم، برنامه بی‌صدا به دیتابیس
# اشتباه وصل می‌شود.
# object storage با profile بالا می‌آید:
#     docker compose --profile storage up -d
#
# پیش‌فرض SeaweedFS است، نه MinIO. دلیلش فنی نیست بلکه محیطی است: ایمیج MinIO روی
# این شبکه قابل دریافت نبود (pull access denied روی docker.io و 401 روی quay.io).
# هر دو درگاه S3 سازگارند و کد برنامه یکی است؛ برای برگشتن به MinIO کافی است
# سرویس minio با profile `storage-minio` بالا بیاید. جزئیات در
# docs/16-local-development.md و ADR-0011.

services:
  postgres:
    image: postgres:16-alpine
    container_name: dm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-document_manager}
      # ترتیب مرتب‌سازی پایدار و مستقل از locale سیستم میزبان
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dm} -d ${POSTGRES_DB:-document_manager}']
      interval: 5s
      timeout: 5s
      retries: 10

  # درگاه S3 پیش‌فرض محیط توسعه.
  s3:
    profiles: ['storage']
    image: ${S3_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: dm-s3
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3-config.json
      - -master.volumeSizeLimitMB=1024
    ports:
      - '${S3_PORT:-9000}:8333'
    volumes:
      - s3-data:/data
      # هویت و کلید دسترسی توسعه؛ مقدار واقعی production از env می‌آید، نه از این فایل.
      - ./seaweedfs:/etc/seaweedfs:ro
    healthcheck:
      # ریشه بدون امضا ۴۰۳ می‌دهد — یعنی درگاه بالا و احراز هویت فعال است.
      # آدرس از `hostname -i` می‌آید چون SeaweedFS روی IP کانتینر گوش می‌دهد، نه لوپ‌بک.
      test:
        [
          'CMD-SHELL',
          'wget -q -S -O /dev/null http://$$(hostname -i):8333/ 2>&1 | grep -q "403\|200"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # جایگزین: در محیطی که ایمیج MinIO در دسترس است، این سرویس به‌جای بالایی بالا بیاید.
  minio:
    profiles: ['storage-minio']
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: dm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dm_minio_dev_password}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

# bucket توسط خود سرویس API در زمان بالا آمدن ساخته می‌شود (ensureBucket)، نه با یک
# container جداگانه؛ یک وابستگی ایمیج کمتر و یک نقطه شکست کمتر.

volumes:
  postgres-data:
  s3-data:
  minio-data:
